name: Daily Scheduler

on:
  schedule:
    - cron: '33 11 * * *'  # 3:33 AM PST (11:33 UTC)
  workflow_dispatch:
    inputs:
      message:
        description: 'Override message (optional)'
        required: false
        default: ''

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm install

      - name: Run scheduler
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          OVERRIDE_MESSAGE: ${{ github.event.inputs.message }}
        run: node src/run.js
